name: Explore ticket site (one-off)

# Manual helper: opens ticket sites in Chromium and logs the data/API calls
# they make, to find the JSON endpoint a new source can use.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated URLs to open"
        type: string
        default: ""
      link_re:
        description: "Regex: which links to print"
        type: string
        default: "bilhete|ticket|/event"
      only_re:
        description: "Regex: only log data responses whose URL/POST body matches"
        type: string
        default: ""
      body_chars:
        description: "Max chars of each response body to print"
        type: string
        default: "700"

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Explore
        env:
          EXPLORE_URLS: ${{ inputs.urls }}
          LINK_RE: ${{ inputs.link_re }}
          ONLY_RE: ${{ inputs.only_re }}
          BODY_CHARS: ${{ inputs.body_chars }}
          CARD_DUMP: "0"
        run: python tools/explore_site.py
