name: Ticket monitor

# Watches the FPF (Portugal national team) and Sporting CP ticket sites and
# notifies via Telegram when a match goes on sale. See README.md.

on:
  schedule:
    # Times are UTC. Lisbon is UTC+0 (winter) / UTC+1 (summer); the script does
    # the final day/night gating in Europe/Lisbon time, so these only need to be
    # a superset of the moments we want to act on.
    #
    # Daytime (Lisbon ~07:00-00:00): every 20 minutes.
    - cron: "0,20,40 6-23 * * *"
    # Night (Lisbon ~00:00-07:00): a few passes; the script throttles to ~2h.
    - cron: "0 0,2,4,6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: normal
        options: [normal, diagnostic, test, chatid, probe]
      probe_url:
        description: "In probe mode: GET this URL (comma-separated) and dump response"
        type: string
        default: ""
      probe_grep:
        description: "In probe mode: if set, download probe_url and grep for this term"
        type: string
        default: ""

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist notification state between runs without committing to the repo.
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}
          restore-keys: |
            ticket-state-

      - name: Run monitor
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_URL: ${{ inputs.probe_url }}
          PROBE_GREP: ${{ inputs.probe_grep }}
        run: |
          python monitor.py --mode "${{ inputs.mode || 'normal' }}"

      # Save updated state only when it actually changed (keeps cache churn low).
      - name: Save state
        if: steps.run.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}-${{ github.run_attempt }}

      # In diagnostic mode, keep the raw HTML so selectors can be calibrated.
      - name: Upload diagnostic HTML
        if: ${{ inputs.mode == 'diagnostic' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-html
          path: "*-page.html"
          if-no-files-found: warn
