name: Ticket monitor

# Watches the FPF (Portugal national team) and Sporting CP ticket sites and
# notifies via Telegram when a match goes on sale. See README.md.

on:
  schedule:
    # Times are UTC. Lisbon is UTC+0 (winter) / UTC+1 (summer); the script does
    # the final day/night gating in Europe/Lisbon time, so these only need to be
    # a superset of the moments we want to act on.
    #
    # Fire every 20 min; monitor.py gates to ~40 min by day / ~2 h at night
    # (Europe/Lisbon, DST-correct). Day window in UTC covers WET & WEST.
    - cron: "*/20 5-23 * * *"
    # Night: hourly; the script throttles it to ~2 h.
    - cron: "0 0,1,2,3,4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: normal
        options: [normal, diagnostic, test, chatid, probe]
      probe_url:
        description: "In probe mode: GET this URL (comma-separated) and dump response"
        type: string
        default: ""
      probe_grep:
        description: "In probe mode: if set, download probe_url and grep for this term"
        type: string
        default: ""

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache the headless Chromium used for browser-rendered sources (Sporting).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Persist notification state between runs without committing to the repo.
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}
          restore-keys: |
            ticket-state-

      - name: Run monitor
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Send a summary of every check (set to "" to go back to quiet mode).
          REPORT_EVERY_RUN: "1"
          PROBE_URL: ${{ inputs.probe_url }}
          PROBE_GREP: ${{ inputs.probe_grep }}
        run: |
          python monitor.py --mode "${{ inputs.mode || 'normal' }}"

      # Save updated state only when it actually changed (keeps cache churn low).
      - name: Save state
        if: steps.run.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}-${{ github.run_attempt }}

      # In diagnostic mode, keep the raw HTML so selectors can be calibrated.
      - name: Upload diagnostic HTML
        if: ${{ inputs.mode == 'diagnostic' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-html
          path: "*-page.html"
          if-no-files-found: warn
