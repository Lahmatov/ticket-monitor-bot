name: Ticket monitor

# Watches the FPF (Portugal national team) and Sporting CP ticket sites and
# notifies via Telegram when a match goes on sale. See README.md.

on:
  schedule:
    # GitHub fires scheduled runs only every few hours in practice, so cron is
    # just a safety net. The real cadence comes from the job itself: a normal
    # run loops for ~5.5 h (checking every 20-40 min by day / 100-140 min at night, random,
    # Europe/Lisbon) and then dispatches its own successor (see last step).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: normal
        options: [normal, diagnostic, test, chatid, probe]
      probe_url:
        description: "In probe mode: GET this URL (comma-separated) and dump response"
        type: string
        default: ""
      probe_grep:
        description: "In probe mode: if set, download probe_url and grep for this term"
        type: string
        default: ""
      probe_post:
        description: "In probe mode: JSON body to POST to probe_url (e.g. GraphQL)"
        type: string
        default: ""

# One monitor loop at a time; a loop run triggered while one is active waits
# its turn. One-off modes (diagnostic/test/probe/chatid) run immediately.
concurrency:
  group: ticket-monitor-${{ (github.event_name == 'schedule' || inputs.mode == 'normal') && 'loop' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # dispatch the next loop run / keep the schedule enabled

jobs:
  check:
    runs-on: ubuntu-latest
    # Loop runs last LOOP_MINUTES; other modes take seconds.
    timeout-minutes: 350
    env:
      LOOP_MINUTES: "330"
      IS_LOOP: ${{ github.event_name == 'schedule' || inputs.mode == 'normal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist notification state between runs without committing to the repo.
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}
          restore-keys: |
            ticket-state-

      - name: Run monitor
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # "changes": message only when something changes (+ /status on
          # demand); "every": full summary after every check.
          REPORT_MODE: "changes"
          PROBE_URL: ${{ inputs.probe_url }}
          PROBE_GREP: ${{ inputs.probe_grep }}
          PROBE_POST: ${{ inputs.probe_post }}
        run: |
          if [ "$IS_LOOP" = "true" ]; then
            python monitor.py --mode normal --loop-minutes "$LOOP_MINUTES"
          else
            python monitor.py --mode "${{ inputs.mode }}"
          fi

      # Save updated state when it changed. Loop runs always save (even when
      # cancelled for a restart): monitor.py writes state.json after every
      # check, so a restart neither repeats alerts nor loses dedup memory.
      - name: Save state
        if: >-
          always() && hashFiles('state.json') != '' &&
          (env.IS_LOOP == 'true' || steps.run.outputs.state_changed == 'true')
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}-${{ github.run_attempt }}

      # In diagnostic mode, keep the raw HTML so selectors can be calibrated.
      - name: Upload diagnostic HTML
        if: ${{ inputs.mode == 'diagnostic' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-html
          path: "*-page.html"
          if-no-files-found: warn

      # Hand over to the next loop run so checks continue without waiting for
      # GitHub's cron. Skipped when the run was cancelled, so cancelling a run
      # (or disabling the workflow) stops the chain.
      - name: Start next loop run
        if: (success() || failure()) && env.IS_LOOP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}" -f mode=normal

      # Scheduled workflows are auto-disabled after 60 days without commits;
      # re-enabling keeps the safety-net cron alive.
      - name: Keep schedule enabled
        if: env.IS_LOOP == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
